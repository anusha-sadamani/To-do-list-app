<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="styles/to-do.css" />
    <script src="scripts/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="to-do">
        <h2>To-Do-List</h2>
        <div class="row">
          <input type="text" id="field" placeholder="Enter the Task" />
          <button id="add" onclick="addTask()">Add</button>
        </div>
        <ul id="task-list"></ul>
      </div>
    </div>
  </body>
</html>
